[project]
name = "scholar"
version = "0.1.0"
description = "AI Scholarship Agent — turns an applicant's materials into an eligibility check, profile, gap analysis, drafted essays, a review, and a submission checklist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
scholar = "scholar.orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
